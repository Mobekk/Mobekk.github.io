<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title | escape }} - {% endif %}{{ site.title | escape }}</title>
    <link rel="me" href="https://infosec.exchange/@Mobekk">
    <link rel="stylesheet" href="{{ "/assets/css/fonts.css" | relative_url | escape }}">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url | escape }}">
    {% feed_meta %}
</head>
<body>
    <div class="grain-overlay"></div>
    
    <header>
        <nav class="container">
            <div class="logo">
                <span class="bracket">[</span>
                <span class="logo-text">Mobekk.blog</span>
                <span class="bracket">]</span>
                <span class="cursor">_</span>
            </div>
            <div class="nav-links">
                <a href="{{ '/' | relative_url | escape }}">posts</a>
                <a href="{{ '/about' | relative_url | escape }}">about</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {{ content }}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 [Bjørn Mobekk]. All rights reserved.</p>
            <div class="footer-links">
                <a href="https://github.com/Mobekk" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://www.linkedin.com/in/bjørn-mobekk-204710183" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
        </div>
    </footer>
</body>
</html>
