title: Mobekk.blog
description: My security blog
url: "https://mobekk.blog"
baseurl: ""

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed

# Publish only the intended dot-directory; keep local tooling/private state excluded.
include:
  - .well-known

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor
  - .bundle
  - .github
  - scripts
  - docs
  - SECURITY.md
  - LICENSE
  - .ruby-version
  - .python-version
  - .bundle-audit.yml
  - .git
  - .agents
  - .codex
  - .aws
