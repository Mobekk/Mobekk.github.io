name: Validate and deploy blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 1'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUNDLE_FROZEN: 'true'
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Audit dependencies
        run: bundle exec bundler-audit check --update
      - name: Build site
        run: bundle exec jekyll build --safe --strict_front_matter --trace
      - name: Verify published files and security policies
        run: python3 scripts/check_site.py _site
      - name: Test malicious metadata rendering
        run: python3 scripts/test_templates.py
      - name: Package Pages artifact
        if: github.event_name != 'pull_request' && github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
